# .github/dependabot.yml
# ─────────────────────────────────────────────────────────────────────────────
# Automated dependency updates via Dependabot.
# Creates PRs weekly for npm package updates.
# PRs are automatically labelled "dependencies" and assigned to the team.
#
# This fulfills the "Automated dependency updates with weekly audits" standard.
# ─────────────────────────────────────────────────────────────────────────────

version: 2

updates:
  # npm packages
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group all non-major Next.js + React updates into a single PR
      nextjs-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Group all dev tool updates (eslint, typescript, tailwind)
      dev-tooling:
        patterns:
          - "eslint*"
          - "typescript"
          - "tailwindcss"
          - "@tailwindcss/*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kathmandu
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
