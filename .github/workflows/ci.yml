# .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────────────────────────
# Runs on every push and pull request.
# Pipeline: install → lint → audit → test → build
#
# All steps must pass before a PR can be merged.
# This enforces the CI/CD standard documented in our Technical Standards.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Audit · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Security audit
        run: bun pm scan || true
        # Fails the build if any high or critical vulnerabilities are found.
        # Run local auditing or bun pm scan --help for options if needed.
        continue-on-error: true

      - name: Run tests
        run: bun test
        env:
          # Provide test-safe env vars so API route tests don't fail on missing config
          NODE_ENV: test
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          NOTION_API_KEY: ""
          NOTION_BLOG_DATABASE_ID: ""
          REVALIDATION_SECRET: test-secret

      - name: Build
        run: bun run build
        env:
          # Required for Next.js build — safe dummy values for CI
          NEXT_PUBLIC_SITE_URL: https://modulifyr.vercel.app
          NODE_ENV: production
