# .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────────────────────────
# Runs on every push and pull request.
# Pipeline: install → lint → audit → test → build
#
# All steps must pass before a PR can be merged.
# This enforces the CI/CD standard documented in our Technical Standards.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Audit · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      # Ignored advisories (dev-only dependencies with no non-breaking fix available):
      # - GHSA-2883-xcg3-v3hh: esbuild (dev-only dependency, no fix available without breaking build)
      # - GHSA-p293-qw3h-jr36: esbuild (dev-only dependency, no fix available without breaking build)
      # - GHSA-2xp9-vwfh-vxw4: esbuild (dev-only dependency, no fix available without breaking build)
      # - GHSA-qhr7-859c-m2p7: brace-expansion (dev-only dependency via eslint/lint-staged, no fix available)
      # - GHSA-6j4f-fj2g-mc7p: brace-expansion (dev-only dependency via eslint/lint-staged, no fix available)
      # - GHSA-vfj7-8cjw-p6xm: braces (dev-only dependency via eslint/lint-staged, fix breaks the build)
      # - GHSA-5gmw-xhrv-c9v3: tinypool (dev-only dependency via vitest, fix breaks the build)
      # - GHSA-85c8-ppgw-ccpr: tinypool (dev-only dependency via vitest, fix breaks the build)
      - name: Security audit
        run: bun audit --audit-level=high --ignore GHSA-2883-xcg3-v3hh --ignore GHSA-p293-qw3h-jr36 --ignore GHSA-2xp9-vwfh-vxw4 --ignore GHSA-qhr7-859c-m2p7 --ignore GHSA-6j4f-fj2g-mc7p --ignore GHSA-vfj7-8cjw-p6xm --ignore GHSA-5gmw-xhrv-c9v3 --ignore GHSA-85c8-ppgw-ccpr
        # Fails the build (non-zero exit) if any HIGH or CRITICAL severity
        # vulnerability is found in dependencies. This step is NOT allowed
        # to be suppressed with `|| true` or `continue-on-error: true` —
        # if a specific advisory is confirmed to be a false positive or an
        # accepted risk, ignore that exact advisory explicitly instead:
        #   bun audit --audit-level=high --ignore CVE-XXXX-YYYYY
        # To review everything including low/moderate locally, run:
        #   bun audit

      - name: Run tests
        run: bun test
        env:
          # Provide test-safe env vars so API route tests don't fail on missing config
          NODE_ENV: test
          UPSTASH_REDIS_REST_URL: ""
          UPSTASH_REDIS_REST_TOKEN: ""
          NOTION_API_KEY: ""
          NOTION_BLOG_DATABASE_ID: ""
          REVALIDATION_SECRET: test-secret

      - name: Build
        run: bun run build
        env:
          # Required for Next.js build — safe dummy values for CI
          NEXT_PUBLIC_SITE_URL: https://modulifyr.vercel.app
          NODE_ENV: production
